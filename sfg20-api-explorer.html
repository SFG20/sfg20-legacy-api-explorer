<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SFG20 API Explorer</title>
<style>
:root {
  --bg: #f3f6f8;
  --panel: #ffffff;
  --ink: #1d2b32;
  --muted: #5a6b74;
  --line: #d9e1e5;
  --brand: #1d7f7c;
  --brand-ink: #ffffff;
  --brand-soft: #e3f2f1;
  --warn-bg: #fff4e0;
  --warn-ink: #7a4a00;
  --warn-line: #f0c36d;
  --bad-bg: #fdeaea;
  --bad-ink: #8a1f1f;
  --ok-bg: #e5f5ea;
  --ok-ink: #1d6b3a;
  --code-bg: #f0f4f6;
  --focus: #0b5cad;
  --get: #1d7f3a;
  --post: #8a5a00;
  --radius: 8px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
:root[data-theme="dark"] {
  --bg: #12191d;
  --panel: #1a2329;
  --ink: #e6edf0;
  --muted: #9bacb5;
  --line: #2b3841;
  --brand: #4cc2bd;
  --brand-ink: #08201f;
  --brand-soft: #1b3533;
  --warn-bg: #3a2c10;
  --warn-ink: #f2cf8c;
  --warn-line: #6b5120;
  --bad-bg: #3a1a1a;
  --bad-ink: #f3b3b3;
  --ok-bg: #16301f;
  --ok-ink: #9fe0b5;
  --code-bg: #0f161a;
  --focus: #7db8ff;
  --get: #5fd18a;
  --post: #f2cf8c;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--sans); display: flex; flex-direction: column; }
a { color: var(--brand); }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
code, pre, .mono { font-family: var(--mono); font-size: 12.5px; }
code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; }
pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; overflow: auto; margin: 8px 0; white-space: pre-wrap; word-break: break-word; }
h2 { font-size: 18px; margin: 0 0 4px; line-height: 1.25; }
h3 { font-size: 14px; margin: 14px 0 6px; }
p { margin: 6px 0; }
table { width: 100%; border-collapse: collapse; margin: 6px 0; font-size: 13px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.table-wrap { overflow-x: auto; }

/* Header */
header.top { flex: none; background: var(--panel); border-bottom: 1px solid var(--line); padding: 7px 14px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
.brand { font-weight: 700; font-size: 16px; color: var(--brand); }
.brand span { color: var(--ink); font-weight: 500; }
.spacer { flex: 1; }
.env { display: flex; align-items: center; gap: 8px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 4px 12px; cursor: pointer; font: inherit; }
.seg button[aria-pressed="true"] { background: var(--brand); color: var(--brand-ink); font-weight: 600; }
.seg button[data-env="live"][aria-pressed="true"] { background: #b42318; color: #fff; }
.pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); background: var(--panel); white-space: nowrap; }
.pill.ok { background: var(--ok-bg); color: var(--ok-ink); border-color: transparent; }
.pill.bad { background: var(--bad-bg); color: var(--bad-ink); border-color: transparent; }
.pill.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-line); }
.btn { border: 1px solid var(--line); background: var(--panel); color: var(--ink); border-radius: 6px; padding: 6px 12px; cursor: pointer; font: inherit; }
.btn:hover:not(:disabled) { border-color: var(--brand); }
.btn.primary { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.small { padding: 3px 9px; font-size: 12px; }
.livebar { flex: none; background: #b42318; color: #fff; padding: 5px 14px; font-size: 13px; display: none; }
.livebar.show { display: block; }

/* Three columns: menu | request 40% | response 40% */
.app { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(170px, 20%) 1fr 1fr; }
.app.single { grid-template-columns: minmax(170px, 20%) 1fr; }
.app.single #colRes { display: none; }
nav.side { background: var(--panel); border-right: 1px solid var(--line); padding: 8px 8px 16px; overflow: auto; min-height: 0; }
nav.side input[type=search] { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; margin-bottom: 4px; }
nav.side .grp { margin: 10px 6px 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
nav.side a { display: flex; align-items: flex-start; gap: 6px; padding: 5px 6px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13px; line-height: 1.3; }
nav.side a:hover { background: var(--brand-soft); }
nav.side a[aria-current="page"] { background: var(--brand-soft); color: var(--brand); font-weight: 600; }
.verb { flex: none; font: 700 9px var(--mono); color: var(--get); border: 1px solid var(--get); border-radius: 3px; padding: 1px 4px; margin-top: 2px; }
.verb.post { color: var(--post); border-color: var(--post); }
.tag-dep { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; background: var(--warn-bg); color: var(--warn-ink); border: 1px solid var(--warn-line); border-radius: 4px; padding: 0 5px; margin-left: 6px; vertical-align: middle; }
.col { overflow: auto; min-height: 0; padding: 12px 14px 20px; }
#colReq { border-right: 1px solid var(--line); }
#colRes { display: flex; flex-direction: column; padding-bottom: 12px; }
.page { max-width: 880px; }

/* Heading block */
.hd { margin-bottom: 8px; }
.urlline { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 4px 0 0; }
.urlline code { word-break: break-all; }
.lede { color: var(--muted); margin: 10px 0; line-height: 1.6; }

/* Accordions */
details.acc { border: 1px solid var(--line); border-radius: var(--radius); background: var(--panel); margin: 0 0 7px; }
details.acc > summary { padding: 8px 12px; cursor: pointer; font-weight: 600; list-style: none; display: flex; align-items: center; gap: 8px; }
details.acc > summary::-webkit-details-marker { display: none; }
details.acc > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--muted); border-bottom: 2px solid var(--muted); transform: rotate(-45deg); transition: transform .12s; flex: none; }
details.acc[open] > summary::before { transform: rotate(45deg); }
details.acc > summary .sum { margin-left: auto; font-weight: 400; color: var(--muted); font-size: 12px; }
details.acc[open] > summary { border-bottom: 1px solid var(--line); }
.accbody { padding: 8px 12px 12px; }
.accbody > :first-child { margin-top: 0; }

/* Forms */
.grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 8px 12px; }
label.f { display: block; font-size: 12px; font-weight: 600; color: var(--muted); }
label.f input { display: block; width: 100%; margin-top: 3px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: 13px var(--mono); }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
.note { font-size: 12px; color: var(--muted); }
.msg { font-size: 12.5px; }
.msg.bad { color: var(--bad-ink); }
.msg.ok { color: var(--ok-ink); }
.notice { border-radius: var(--radius); padding: 7px 10px; margin: 8px 0; border: 1px solid var(--line); background: var(--brand-soft); font-size: 13px; }
.notice.warn { background: var(--warn-bg); color: var(--warn-ink); border-color: var(--warn-line); }

/* Response column */
.resbar { flex: none; display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); }
.spin { flex: none; width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--brand); border-radius: 50%; animation: spin .8s linear infinite; }
.spin.idle { animation: none; border-top-color: var(--line); }
.spin.ok { animation: none; border-color: var(--ok-ink); background: var(--ok-bg); }
.spin.bad { animation: none; border-color: var(--bad-ink); background: var(--bad-bg); }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }
.restext { font-weight: 600; }
.reselapsed { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 12px; }
.resmeta { flex: none; margin: 6px 2px 0; font-size: 12px; color: var(--muted); word-break: break-all; min-height: 1.4em; }
#resBody { flex: 1; min-height: 0; margin: 6px 0 0; overflow: auto; background: var(--panel); }
.empty { color: var(--muted); }


.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
a.btn { text-decoration: none; display: inline-block; }
select.sel { padding: 4px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font: inherit; max-width: 240px; }
.app.setup { grid-template-columns: 1fr; }
.app.setup nav.side { display: none; }
.app.setup #colReq { border-right: 0; }
.wiz { max-width: 700px; margin: 0 auto; }
.stepper { list-style: none; display: flex; flex-wrap: wrap; gap: 6px 18px; padding: 0; margin: 12px 0; }
.stepper li { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 13px; }
.stepper .n { width: 22px; height: 22px; border-radius: 50%; border: 1px solid var(--line); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; background: var(--panel); }
.stepper li.cur { color: var(--ink); font-weight: 600; }
.stepper li.cur .n { background: var(--brand); color: var(--brand-ink); border-color: var(--brand); }
.stepper li.done .n { background: var(--ok-bg); color: var(--ok-ink); border-color: transparent; }
.wiz .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 16px 14px; margin: 8px 0; }
.choice { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; margin: 6px 0; cursor: pointer; background: var(--bg); }
.choice:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }
.choice input { margin-top: 4px; }

.sw td:nth-child(2) { min-width: 360px; }
.sw td:nth-child(3) { min-width: 240px; }
.sw td:nth-child(5) { min-width: 120px; }
details.mini { margin: 4px 0 0; }
details.mini > summary { cursor: pointer; font-size: 12px; color: var(--brand); font-weight: 600; }
details.mini[open] { margin-bottom: 6px; }
.accbody p { margin: 12px 0; line-height: 1.65; }
.accbody ul, .accbody ol { margin: 12px 0; padding-left: 24px; }
.accbody li { margin: 10px 0; line-height: 1.6; }
td ul.tight { margin: 0; padding-left: 18px; }
td ul.tight li { margin: 6px 0; line-height: 1.5; }
.menu-btn { display: none; }
@media (max-width: 980px) {
  html, body { height: auto; }
  body { display: block; }
  .app, .app.single { display: block; }
  .app.single #colRes { display: none; }
  nav.side { display: none; border-right: 0; border-bottom: 1px solid var(--line); }
  nav.side.open { display: block; }
  #colReq { border-right: 0; }
  #colRes { min-height: 60vh; }
  .menu-btn { display: inline-block; }
}
</style>
</head>
<body>
<header class="top">
  <button class="btn small menu-btn" id="menuBtn" aria-expanded="false" aria-controls="side">Menu</button>
  <div class="brand">SFG20 <span>API Explorer</span></div>
  <div class="env" id="cfgGroup" role="group" aria-label="Configuration">
    <label class="sr" for="cfgSelect">Configuration</label>
    <select id="cfgSelect" class="sel"></select>
    <span class="pill" id="envBadge"></span>
    <code id="rootUrl"></code>
    <a class="btn small" href="#configs">Manage</a>
  </div>
  <div class="spacer"></div>
  <span class="pill" id="tokenPill" role="status" aria-live="polite">No token</span>
  <button class="btn small" id="themeBtn" type="button" aria-pressed="false">Dark mode</button>
</header>
<div class="livebar" id="liveBar" role="alert">The active configuration uses the Live environment. Requests only read data (GET). They run on the live service.</div>

<div class="app" id="app">
  <nav class="side" id="side" aria-label="Endpoints and reference">
    <input type="search" id="navFilter" placeholder="Filter" aria-label="Filter endpoints">
    <div id="navList"></div>
  </nav>
  <section class="col" id="colReq" aria-label="Request"></section>
  <section class="col" id="colRes" aria-label="Response"></section>
</div>

<script>

 * Configuration
 * ------------------------------------------------------------------ */

};
const REQUEST_TIMEOUT_MS = 120000;
const TOKEN_TIMEOUT_MS = 30000;

/* ------------------------------------------------------------------ *
 * Reference data (SFG20 API User Guide v3.4)
 * ------------------------------------------------------------------ */

    return { ok: true };

  catch (e) { return null; }

    return { ok: false, status: res.status, statusText: res.statusText, text, data, ms };
  } catch (e) {
    return { ok: false, network: true, aborted: e.name === "AbortError", ms: performance.now() - t0 };
  }
}
function tokenMessage(r, cfg) {
  if (r.missing) return "Enter all four credentials.";
  if (r.ok) return "Token received for " + cfg.name + ".";
  if (r.aborted) return "There was no response after 30 seconds. Check your network connection and the environment of this configuration.";
  if (r.network) return "The browser could not read a response from " + rootOf(cfg) + ". A credential is probably wrong for this environment. A network block can also cause this problem. See Troubleshooting.";
  if (r.data && r.data.error) return "Credentials rejected: " + r.data.error + (r.data.error_description ? " (" + r.data.error_description + ")" : "") + ".";
  return "The API returned status " + r.status + " and no token.";
}
function applyToken(cfg, r) {
  if (r.ok) { cfg.token = r.token; saveStore(); }
  refreshChrome();
}

/* ------------------------------------------------------------------ *
 * Response column
 * ------------------------------------------------------------------ */
function buildResponseColumn(viewId) {
  const spin = h("span", { class: "spin idle", "aria-hidden": "true" });
  const text = h("span", { class: "restext", role: "status", "aria-live": "polite", text: "No request sent" });
  const elapsed = h("span", { class: "reselapsed" });
  const copyBtn = h("button", { class: "btn small", type: "button", text: "Copy", disabled: true });
  const dlBtn = h("button", { class: "btn small", type: "button", text: "Download", disabled: true });
  const meta = h("div", { class: "resmeta" });
  const body = h("pre", { id: "resBody" });
  body.append(h("span", { class: "empty", text: "The response appears here." }));
  let timer = null, t0 = 0, current = "";

  const tick = () => { elapsed.textContent = ((performance.now() - t0) / 1000).toFixed(1) + " s"; };
  function startTimer() { stopTimer(); t0 = performance.now(); tick(); timer = setInterval(tick, 100); }
  function stopTimer() { if (timer) { clearInterval(timer); timer = null; } }

  const api = {
    node: h("div", { style: "display:flex;flex-direction:column;height:100%;min-height:0" },
      h("div", { class: "resbar" }, spin, text, elapsed, h("span", { style: "flex:1" }), copyBtn, dlBtn),
      meta, body),
    requesting(url) {
      startTimer(); current = "";
      spin.className = "spin"; text.textContent = "Requesting endpoint"; meta.textContent = url;
      body.replaceChildren(h("span", { class: "empty", text: "Waiting for the API to respond." }));
      copyBtn.disabled = dlBtn.disabled = true;
    },
    receiving(status) {
      spin.className = "spin"; text.textContent = "Receiving data" + (status ? " (HTTP " + status + ")" : "");
      body.replaceChildren(h("span", { class: "empty", text: "The API started to send the response. The page is reading the data." }));
    },
    done(r, url, opts) {
      stopTimer();
      opts = opts || {};
      const good = r.status >= 200 && r.status < 300;
      spin.className = "spin " + (good ? "ok" : "bad");
      const count = Array.isArray(r.parsed) ? ", " + r.parsed.length + " item" + (r.parsed.length === 1 ? "" : "s") : "";
      text.textContent = "HTTP " + r.status + (r.statusText ? " " + r.statusText : "") + (opts.cachedAt ? " (cached copy)" : "");
      elapsed.textContent = opts.cachedAt
        ? "Saved " + fmtDate(opts.cachedAt) + ", " + r.text.length.toLocaleString(LOCALE) + " characters" + count
        : (r.ms / 1000).toFixed(2) + " s, " + r.text.length.toLocaleString(LOCALE) + " characters" + count;
      meta.textContent = url || meta.textContent;
      let shown = r.parsed !== undefined ? JSON.stringify(r.parsed, null, 2) : r.text;
      current = r.text;
      const parts = [];
      if (shown.length > MAX_RENDER_CHARS) {
        shown = shown.slice(0, MAX_RENDER_CHARS);
        parts.push(h("div", { class: "notice warn", text: "The response has more than " + MAX_RENDER_CHARS.toLocaleString(LOCALE) + " characters. The page shows only the first " + MAX_RENDER_CHARS.toLocaleString(LOCALE) + " characters. Use Download to get the complete response." }));
      }
      if (opts.cachedAt) parts.push(h("div", { class: "notice", text: "This is a stored copy. The page did not call the API. To get a new response, select Fetch from server." }));
      if (r.status === 401) parts.push(h("div", { class: "notice", text: "Status 401: the token is missing or has expired. Request a new token." }));
      body.replaceChildren(...parts, document.createTextNode(shown || "(empty body)"));
      copyBtn.disabled = dlBtn.disabled = !r.text;
    },
    fail(msg) {
      stopTimer();
      spin.className = "spin bad"; text.textContent = "Request failed";
      body.replaceChildren(document.createTextNode(msg));
      copyBtn.disabled = dlBtn.disabled = true;
    },
    cancelled() {
      stopTimer(); spin.className = "spin idle"; text.textContent = "Cancelled";
      body.replaceChildren(h("span", { class: "empty", text: "The request was cancelled." }));
    }
  };
  copyBtn.addEventListener("click", () => navigator.clipboard && navigator.clipboard.writeText(current));
  dlBtn.addEventListener("click", () => downloadText(current, viewId + ".json"));
  api.restore = last => { if (last) api.done(last.r, last.url); };
  return api;
}

/* ---- Setup wizard (first run, add, edit) ---- */
function pageWizard(editId) {
  const editing = editId ? findConfig(editId) : null;
  const first = !configs().length;
  const draft = editing
    ? { name: editing.name, env: editing.env, clientId: editing.clientId, clientSecret: editing.clientSecret, customerId: editing.customerId, customerSecret: editing.customerSecret }
    : { name: first ? "Test" : "", env: "test", clientId: "", clientSecret: "", customerId: "", customerSecret: "" };
  const STEPS = ["Environment", "Client credentials", "Customer credentials", "Verify and save"];
  let step = 1, verify = null, verifyToken = null, showSecrets = false;
  const root = h("div", { class: "wiz" });

  const credsChanged = () => !editing || ["env", "clientId", "clientSecret", "customerId", "customerSecret"].some(k => draft[k] !== editing[k]);

  function field(id, label, key, secret, hint) {
    const input = h("input", { id, type: secret && !showSecrets ? "password" : "text", autocomplete: "off", spellcheck: "false" });
    input.value = draft[key];
    input.addEventListener("input", () => { draft[key] = input.value; verify = null; verifyToken = null; });
    return h("div", null, h("label", { class: "f", for: id }, label, input), hint ? h("div", { class: "note", text: hint }) : null);
  }
  function showToggle() {
    const chk = h("input", { type: "checkbox", id: "wizShow" });

    chk.addEventListener("change", () => { showSecrets = chk.checked; draw(); });
    return h("div", { class: "row" }, chk, h("label", { for: "wizShow", class: "note", text: "Show secrets" }));
  }
  function stepper() {
    return h("ol", { class: "stepper", "aria-label": "Setup steps" }, STEPS.map((s, i) => {
      const n = i + 1;
      return h("li", { class: n === step ? "cur" : n < step ? "done" : "", "aria-current": n === step ? "step" : null },
        h("span", { class: "n", text: n < step ? "✓" : String(n) }), h("span", { text: s }));
    }));
  }
  function body() {
    if (step === 1) {
      const radio = (value, title, url, text) => {
        const input = h("input", { type: "radio", name: "env", value, id: "env_" + value });
        input.checked = draft.env === value;
        input.addEventListener("change", () => { draft.env = value; verify = null; verifyToken = null; });
        return h("label", { class: "choice", for: "env_" + value }, input,
          h("span", null, h("strong", { text: title }), h("br"), h("code", { text: url }), h("br"), h("span", { class: "note", text: text })));
      };
      return h("div", null,
        h("div", null, h("label", { class: "f", for: "wizName" }, "Configuration name",
          (() => { const i = h("input", { id: "wizName", type: "text", autocomplete: "off", maxlength: "60" }); i.value = draft.name; i.addEventListener("input", () => { draft.name = i.value; }); return i; })()),
          h("div", { class: "note", text: "Use a name that identifies this configuration, for example OTE or Live - Customer name." })),
        h("h3", { text: "Environment" }),
        radio("test", "Test (OTE)", ENVS.test.root, "For development and testing."),
        radio("live", "Live", ENVS.live.root, "Production data. Use Live credentials."));
    }
    if (step === 2) {
      return h("div", null,
        h("p", { class: "note", text: "SFG20 gives these credentials to the Approved Provider." }),
        h("div", { class: "grid2" }, field("wCid", "Client (Bridge) ID", "clientId", false), field("wCsec", "Client (Bridge) Secret", "clientSecret", true)),
        showToggle());
    }
    if (step === 3) {
      return h("div", null,
        h("p", { class: "note", text: "SFG20 gives these credentials for the customer whose library you want to read." }),
        h("div", { class: "grid2" }, field("wUid", "Customer ID", "customerId", false), field("wUsec", "Customer Secret", "customerSecret", true)),
        showToggle());
    }

    if (verify) { msg.className = "msg " + (verify.ok ? "ok" : "bad"); msg.textContent = verify.text; }
    const vbtn = h("button", { class: "btn", type: "button", text: "Request token to verify" });
    vbtn.addEventListener("click", async () => {
      vbtn.disabled = true; msg.className = "msg"; msg.textContent = "Requesting token...";
      const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), TOKEN_TIMEOUT_MS);
      const r = await tokenCall(draft, null, ctrl.signal);
      clearTimeout(to);
      verifyToken = r.ok ? r.token : null;
      verify = { ok: r.ok, text: tokenMessage(r, { name: draft.name || "this configuration", env: draft.env }) };
      vbtn.disabled = false; draw();
    });
    return h("div", null,
      table(["Setting", "Value"], [
        ["Name", draft.name], ["Environment", ENVS[draft.env].label], ["URL", ENVS[draft.env].root],
        ["Client ID", mask(draft.clientId, 8)], ["Client Secret", mask(draft.clientSecret)],
        ["Customer ID", mask(draft.customerId, 8)], ["Customer Secret", mask(draft.customerSecret)]]),

  }
  function validate() {
    const err = t => { errBox.textContent = t; return false; };

    if (step === 1) {
      const name = draft.name.trim();

      if (configs().some(c => c.id !== (editing && editing.id) && c.name.toLowerCase() === name.toLowerCase())) return err("A configuration with this name already exists.");
      draft.name = name;

    if (step === 2 && (!draft.clientId.trim() || !draft.clientSecret.trim())) return err("Enter the Client (Bridge) ID and secret.");

    ["clientId", "clientSecret", "customerId", "customerSecret"].forEach(k => { draft[k] = draft[k].trim(); });
    if (editing) {

      state.store.activeId = editing.id;
    } else {
      const c = Object.assign({ id: newId(), token: verifyToken || null }, draft);
      configs().push(c); state.store.activeId = c.id;
    }
    state.last = {};

    location.hash = editing ? "#configs" : "#schedules-v2";

  const errBox = h("div", { class: "msg bad", role: "alert" });
  function draw() {
    const back = h("button", { class: "btn", type: "button", text: "Back", disabled: step === 1, onclick: () => { errBox.textContent = ""; step--; draw(); } });
    const next = step < 4
      ? h("button", { class: "btn primary", type: "button", text: "Next", onclick: () => { if (validate()) { step++; draw(); } } })
      : h("button", { class: "btn primary", type: "button", text: editing ? "Save changes" : "Save and use", onclick: save });
    const cancel = configs().length ? h("button", { class: "btn", type: "button", text: "Cancel", onclick: () => { location.hash = "#configs"; } }) : null;
    setKids(root,
      h("h2", { text: editing ? "Edit configuration" : first ? "Set up a configuration" : "Add configuration" }),
      first ? h("div", null, h("p", { class: "lede", text: "This browser has no stored configuration." }), h("p", { class: "lede", text: "A configuration has a name, an environment and four credentials. You need the credentials to request a token." })) : null,
      stepper(),
      h("div", { class: "card" }, h("h3", { style: "margin-top:0", text: "Step " + step + " of 4: " + STEPS[step - 1] }), body(), errBox),
      h("div", { class: "row" }, back, next, cancel));
  }
  draw();
  return root;
}

/* ---- Cached responses page ---- */
function endpointForUrl(url) {
  let path; try { path = new URL(url).pathname; } catch (e) { return null; }
  return ENDPOINTS.find(ep => new RegExp("^" + ep.path.replace(/[.*+?^$()|[\]\\]/g, "\\$&").replace(/\{[^}]+\}/g, "[^/]+") + "$", "i").test(path)) || null;
}
function pageCache() {
  const wrap = h("div", { class: "page", style: "max-width:1100px" });
  const msg = h("div", { class: "msg", role: "status", "aria-live": "polite" });
  let selectedKey = null;

  function viewer(e) {
    const hit = cacheGet(e.cfgId, e.url);
    if (!hit) return h("div", { class: "notice warn", text: "This cached response is no longer available." });
    let parsed; try { parsed = JSON.parse(hit.text); } catch (err) { /* not JSON */ }

      h("pre", { style: "max-height:480px", text: shown || "(empty body)" }));
  }

  function draw() {
    const entries = cacheEntries();

        msg),

            const c = findConfig(e.cfgId);
            return [c ? c.name : "(deleted configuration)", h("code", { text: e.url.replace(/^https?:\/\//, "") }), e.savedAt ? fmtDate(e.savedAt) : "unknown",

                h("button", { class: "btn small", type: "button", text: "Delete", onclick: () => { safeStore(localStorage, "del", e.key); draw(); } }))];
          }))

        : "To store a response, select Cache this response in local storage on an endpoint page." }));
    if (current) { const pre = wrap.querySelector("pre"); if (pre) pre.scrollTop = 0; }

/* ---- Swagger index page ---- */
function pageSwagger() {
  const wrap = h("div", { class: "page", style: "max-width:1180px" });
  const root = rootUrl();
  const norm = p => p.toLowerCase().replace(/\{[^}]+\}/g, "{}");
  const byPath = {}; ENDPOINTS.forEach(e => { byPath[norm(e.path)] = e; });
  // /api2/v2/X is the same action as /api2/X/v2
  const aliasTarget = p => /^\/api2\/v2\//i.test(p) ? "/api2/" + p.slice("/api2/v2/".length) + "/v2" : null;
  const firstSentence = t => ((t || "").match(/^.*?[.!?](\s|$)/) || [t || ""])[0].trim();

  function head(extra) {
    return [
      h("h2", { text: "API index (Swagger)" }),
      h("p", { class: "lede", text: "This page shows the endpoints in the Swagger document of the " + ENVS[active().env].label + " API." }),
      h("p", { class: "lede", text: "The page reads the document from " + root + "/swagger/docs/api2. It adds descriptions from the documented behaviour of the API." }),
      h("div", { class: "row", style: "margin:8px 0" },
        h("a", { class: "btn", href: root + "/swagger/ui/index", target: "_blank", rel: "noopener noreferrer", text: "Open the Swagger UI of the API" }),
        extra || null)
    ];
  }
  function behaviour() {
    return acc("How the API behaves", "all endpoints", h("ul", null,
      h("li", { text: "Every endpoint needs the HTTP header Authorization: Bearer {access token}. Get the token with the Token request." }),
      h("li", { text: "Status 401 means that the token is missing or has expired. Status 403 means that the token was not issued for API access." }),
      h("li", { text: "Responses are always JSON. The Swagger document lists XML as a format. However, the API does not return XML, even if the HTTP header Accept asks for it." }),
      h("li", { text: "Endpoint paths are not case sensitive. /api2/ServiceModels and /api2/servicemodels are the same endpoint." }),
      h("li", { text: "A path that starts with /api2/v2/ is another name for the path that ends with /v2. For example, /api2/v2/schedules and /api2/schedules/v2 do the same thing." }),
      h("li", { text: "A request that returns many schedules takes more time, because the API reads each schedule separately. To get only the IDs, use List schedule IDs. It is much faster." }),
      h("li", { text: "The API records every successful request for the usage report of the account. The record has the endpoint, the number of records and the size of the response in MB." }),
      h("li", { text: "A server error returns status 500 with an empty body. The V1 schedule list returns a number instead. The number is an error code. The API gives no more detail. Write down the time and the URL. Give them to SFG20 support." }),
      h("li", { text: "A list endpoint that finds no items returns status 200 with []. Status 404 appears only when you ask for one item or one code." })
    ), true);
  }
  function details(ep) {
    const body = h("div", null,
      ep.purpose.map(t => h("p", { text: t })),
      ep.params.length ? table(["Parameter", "Type", "Description"], ep.params.map(p => [p.name, p.type, p.desc])) : null,
      table(["Status", "Meaning"], statusRows(ep)),
      ep.notes && ep.notes.length ? h("ul", null, ep.notes.map(n => h("li", { text: n }))) : null);
    return h("details", { class: "mini" }, h("summary", { text: "Details" }), body);
  }
  function draw(doc) {
    const rows = {};
    for (const [path, ops] of Object.entries(doc.paths || {})) {
      for (const [method, op] of Object.entries(ops)) {
        const tag = ((op.tags && op.tags[0]) || "Other").replace(/Api$/, "");
        const params = (op.parameters || []).map(p => p.name + " (" + (p.format || p.type || "") + ")").join(", ") || "none";
        let ep = byPath[norm(path)], aliasOf = null;
        if (!ep && aliasTarget(path)) { aliasOf = aliasTarget(path); ep = byPath[norm(aliasOf)]; }
        let summary, explorer;
        if (aliasOf) {
          summary = h("span", { class: "note" }, "Another name for ", h("code", { text: aliasOf }), ".");
          explorer = ep ? h("a", { href: "#" + ep.id, text: "Open" }) : "-";
        } else if (ep) {
          summary = ep.purpose[0];
          explorer = h("div", null, h("a", { href: "#" + ep.id, text: "Open" }),
            ep.status === "deprecated" ? h("div", { style: "margin-top:4px" }, h("span", { class: "tag-dep", style: "margin-left:0", text: "Deprecated" })) : null);
        } else {
          summary = h("span", { class: "note", text: "No description available." });
          explorer = "-";
        }
        (rows[tag] = rows[tag] || []).push([
          h("span", { class: "verb", text: method.toUpperCase() }),
          h("div", null, h("code", { text: path }), !aliasOf && ep ? details(ep) : null),
          summary, params, explorer]);
      }
    }
    const count = Object.values(rows).reduce((n, r) => n + r.length, 0);
    setKids(wrap,
      ...head(h("button", { class: "btn", type: "button", text: "Download JSON", onclick: () => downloadText(JSON.stringify(doc, null, 2), "swagger-" + active().env + ".json") })),
      h("div", { class: "notice", text: "The Swagger document gives the endpoints and the path parameters. The descriptions, status codes and behaviour come from the source code of the API. SFG20 checked the schedule ID, NRM code and service model summary endpoints against the live API. " + count + " endpoints in total." }),
      behaviour(),
      Object.entries(rows).map(([tag, r]) => { const t = table(["Method", "Endpoint", "Summary", "Parameters", "Endpoint page"], r); t.classList.add("sw"); return acc(tag, r.length + " endpoint" + (r.length === 1 ? "" : "s"), t, true); }));
  }
  async function load(force) {
    if (!force && state.swagger[root]) return draw(state.swagger[root]);
    setKids(wrap, ...head(), h("p", { class: "note", text: "Reading " + root + "/swagger/docs/api2" }));
    try {
      const res = await fetch(root + "/swagger/docs/api2", { headers: { "Accept": "application/json" } });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const doc = await res.json();
      state.swagger[root] = doc;
      draw(doc);
    } catch (e) {
      setKids(wrap, ...head(h("button", { class: "btn", type: "button", text: "Retry", onclick: () => load(true) })),
        h("div", { class: "notice warn", text: "The page could not read the Swagger document from this environment (" + (e.message || "network error") + "). You can try the Swagger UI link above." }));
    }
  }
  load(false);
  return wrap;
}

/* ---- Request column for the token and endpoints ---- */
function noConfigNotice() {

}

function authAccordion(onToken) {
  const cfg = active();
  const msg = h("span", { class: "msg", role: "status", "aria-live": "polite" });
  const btn = h("button", { class: "btn primary", type: "button", text: "Request token" });
  const a = acc("Authentication", tokenStatusText(cfg), h("div", null,
    h("p", null, "Configuration: ", h("strong", { text: cfg.name }), " ", envPill(cfg)),
    h("div", { class: "row" }, btn, msg),
    h("p", { class: "note" }, h("a", { href: "#setup/" + cfg.id, text: "Edit configuration" }), " or ", h("a", { href: "#configs", text: "manage configurations" }), ".")),
    !tokenOk(cfg));
  btn.addEventListener("click", async () => {
    btn.disabled = true; msg.className = "msg"; msg.textContent = "Requesting token";
    const ctrl = new AbortController(); const to = setTimeout(() => ctrl.abort(), TOKEN_TIMEOUT_MS);
    const r = await tokenCall(cfg, null, ctrl.signal);
    clearTimeout(to); applyToken(cfg, r);
    msg.className = "msg " + (r.ok ? "ok" : "bad"); msg.textContent = tokenMessage(r, cfg);
    a.setSummary(tokenStatusText(cfg));

function docAccordions(ep) {

  if (ep.notes && ep.notes.length) out.push(acc("Notes", ep.notes.length + (ep.notes.length === 1 ? " note" : " notes"), h("ul", null, ep.notes.map(n => h("li", { text: n })))));
  if (ep.id === "token") {

    out.push(acc("Example response", "", h("pre", { text: JSON.stringify(ep.example, null, 2) })));
    out.push(acc("Errors", "", table(["Result", "Meaning"], ep.errors)));
    return out;
  }
  out.push(acc("Parameters and HTTP headers", ep.params.length + " parameter" + (ep.params.length === 1 ? "" : "s"), h("div", null,
    ep.params.length ? table(["Parameter", "Where", "Type", "Description"], ep.params.map(p => [p.name, p.where === "path" ? "URL path" : p.where, p.type, p.desc])) : h("p", { text: "This endpoint has no parameters." }),
    table(["HTTP header", "Value"], [["Accept", "application/json"], ["Authorization", "Bearer {access token}"]]))));
  if (ep.fields.length) {
    out.push(acc("Response fields", ep.fields.join(", "), h("div", null, ep.fields.map(n => h("div", null, h("h3", { text: n }), table(["Property", "Type", "Description"], FIELDS[n]))))));

function headingBlock(ep) {

    h("h2", null, ep.title, ep.status === "deprecated" ? h("span", { class: "tag-dep", text: "Deprecated" }) : null),

    h("div", { class: "urlline" }, h("span", { class: "verb" + (method === "POST" ? " post" : ""), text: method }), h("code", { text: "{Root endpoint}" + ep.path })),
    ep.status === "deprecated" ? h("div", { class: "notice warn", text: "Deprecated. This endpoint stays for existing integrations. For new work, use the V2 endpoint." }) : null,

  );

function viewToken(panel) {
  const ep = TOKEN_DOC;
  const cfg = active();
  const msg = h("span", { class: "msg", role: "status", "aria-live": "polite" });
  const send = h("button", { class: "btn primary", type: "button", text: "Send" });
  const cancel = h("button", { class: "btn", type: "button", text: "Cancel", disabled: true });
  const url = rootOf(cfg) + "/token";

  const reqAcc = acc("Request", "POST " + ep.path, h("div", null,
    table(["Setting", "Value"], [
      ["Configuration", cfg.name], ["Environment", ENVS[cfg.env].label],
      ["Client ID", mask(cfg.clientId, 8)], ["Client Secret", mask(cfg.clientSecret)],
      ["Customer ID", mask(cfg.customerId, 8)], ["Customer Secret", mask(cfg.customerSecret)]]),
    h("div", { class: "urlline" }, h("span", { class: "note", text: "URL" }), h("code", { text: url })),
    h("div", { class: "row" }, send, cancel, msg),
    h("p", { class: "note" }, h("a", { href: "#setup/" + cfg.id, text: "Edit configuration" }), ".")), true);

  send.addEventListener("click", async () => {
    send.disabled = true; cancel.disabled = false; msg.textContent = "";
    const ctrl = new AbortController(); state.abort = ctrl;
    const to = setTimeout(() => ctrl.abort(), TOKEN_TIMEOUT_MS);
    panel.requesting(url);
    const r = await tokenCall(cfg, phase => { if (phase === "receive") panel.receiving(); }, ctrl.signal);
    clearTimeout(to); state.abort = null;
    send.disabled = false; cancel.disabled = true;
    if (r.missing) { panel.fail("The configuration does not have all four credentials."); msg.className = "msg bad"; msg.textContent = tokenMessage(r, cfg); return; }
    if (r.aborted && ctrl.userCancelled) { panel.cancelled(); return; }
    if (r.network || r.aborted) { panel.fail(tokenMessage(r, cfg)); msg.className = "msg bad"; msg.textContent = tokenMessage(r, cfg); return; }
    applyToken(cfg, r);
    let parsed; try { parsed = JSON.parse(r.text); } catch (e) { /* leave undefined */ }
    const result = { status: r.status, statusText: r.statusText, text: r.text, parsed, ms: r.ms };
    state.last.token = { r: result, url };
    panel.done(result, url);
    msg.className = "msg " + (r.ok ? "ok" : "bad"); msg.textContent = r.ok ? tokenStatusText(cfg) + "." : tokenMessage(r, cfg);
  });
  cancel.addEventListener("click", () => { if (state.abort) { state.abort.userCancelled = true; state.abort.abort(); } });
  return [headingBlock(ep), reqAcc, ...docAccordions(ep)];
}

function curlFor(url, showToken) {
  const a = active();
  const tok = showToken && a && a.token ? a.token.access : "{access token}";
  return "curl -X GET '" + url + "' \\\n  -H 'Accept: application/json' \\\n  -H 'Authorization: Bearer " + tok + "'";
}
function buildUrl(ep, values) {
  let p = ep.path;
  for (const prm of ep.params) p = p.replace("{" + prm.name + "}", encodeURIComponent((values[prm.name] || "").trim()));
  return rootUrl() + p;
}

function viewEndpoint(ep, panel) {
  const cfg = active();
  const cacheChk = h("input", { type: "checkbox", id: "cacheChk" });
  cacheChk.checked = cacheOptGet(ep.id);
  const cacheInfo = h("div", { class: "note", role: "status", "aria-live": "polite" });
  const viewCacheBtn = h("button", { class: "btn primary", type: "button", text: "View cache", style: "display:none" });
  const clearCacheBtn = h("button", { class: "btn small", type: "button", text: "Clear cached copy", style: "display:none" });
  const values = {};
  ep.params.forEach(p => { values[p.name] = p.example || ""; });
  const urlCode = h("code", { text: "" });
  const curlPre = h("pre", { text: "" });
  const showTok = h("input", { type: "checkbox", id: "showTok" });
  const msg = h("span", { class: "msg", role: "status", "aria-live": "polite" });
  const send = h("button", { class: "btn primary", type: "button", text: "Send" });
  const cancel = h("button", { class: "btn", type: "button", text: "Cancel", disabled: true });

  function refreshPreview() {
    urlCode.textContent = buildUrl(ep, values);
    curlPre.textContent = curlFor(urlCode.textContent, showTok.checked);
    updateCacheInfo();
  }
  function updateCacheInfo() {
    const meta = cacheMeta(cfg.id, buildUrl(ep, values));
    cacheInfo.textContent = meta
      ? "Cached copy saved " + fmtDate(meta.savedAt) + " (" + fmtNum(meta.size) + " characters)." + (cacheChk.checked ? "" : " Caching is off, so a new response is not stored.")
      : (cacheChk.checked ? "No cached copy yet. The next successful response is stored." : "");
    send.textContent = meta ? "Fetch from server" : "Send";
    send.className = meta ? "btn" : "btn primary";
    viewCacheBtn.style.display = meta ? "" : "none";
    clearCacheBtn.style.display = meta ? "" : "none";
  }
  showTok.addEventListener("change", refreshPreview);

  const paramInputs = ep.params.map(p => {
    const input = h("input", { id: "p_" + p.name, type: "text", autocomplete: "off", spellcheck: "false" });
    input.value = values[p.name];
    input.addEventListener("input", () => { values[p.name] = input.value; refreshPreview(); });
    return h("label", { class: "f", for: "p_" + p.name }, p.name + " (" + p.type + ")", input);
  });

  const requestSummary = () => tokenValid() ? "Token ready" : "No valid token";
  const auth = authAccordion(() => { reqAcc.setSummary(requestSummary()); });
  const reqAcc = acc("Request", requestSummary(), h("div", null,
    paramInputs.length ? h("div", { class: "grid2" }, paramInputs) : h("p", { class: "note", text: "No parameters." }),
    h("div", { class: "urlline" }, h("span", { class: "note", text: "URL" }), urlCode),
    h("div", { class: "row" }, viewCacheBtn, send, cancel, msg),
    h("div", { class: "row" }, cacheChk, h("label", { for: "cacheChk", class: "note", text: "Cache this response in local storage" }), clearCacheBtn),
    cacheInfo), true);
  const curlAcc = acc("curl command", "", h("div", null, curlPre,
    h("div", { class: "row" }, showTok, h("label", { for: "showTok", class: "note", text: "Include the current token in the command. Do not select this option if you will share the command." }))));

  async function run() {
    const missing = ep.params.filter(p => p.required && !(values[p.name] || "").trim());
    const fail = t => { msg.className = "msg bad"; msg.textContent = t; };
    if (missing.length) return fail("Enter " + missing.map(m => m.name).join(", ") + ".");
    const url = buildUrl(ep, values);
    if (!cfg.token) { auth.open = true; return fail("There is no token. Request a token in the Authentication section."); }
    if (!tokenOk(cfg)) { auth.open = true; return fail("The token has expired. Request a new token in the Authentication section."); }
    msg.className = "msg"; msg.textContent = "";
    send.disabled = viewCacheBtn.disabled = true; cancel.disabled = false;
    const ctrl = new AbortController(); state.abort = ctrl;
    const timer = setTimeout(() => ctrl.abort(), REQUEST_TIMEOUT_MS);
    const t0 = performance.now();
    panel.requesting(url);
    try {
      const res = await fetch(url, { method: "GET", headers: { "Accept": "application/json", "Authorization": "Bearer " + cfg.token.access }, signal: ctrl.signal });
      panel.receiving(res.status);
      const text = await res.text();
      let parsed; try { parsed = JSON.parse(text); } catch (e) { /* not JSON */ }
      const result = { status: res.status, statusText: res.statusText, text, parsed, ms: performance.now() - t0 };
      state.last[ep.id] = { r: result, url };
      panel.done(result, url);
      if (cacheChk.checked && result.status >= 200 && result.status < 300) {
        const saved = cachePut(cfg.id, url, result);
        msg.className = "msg " + (saved.ok ? "ok" : "bad");
        msg.textContent = saved.ok ? "Response cached." : "The response was not cached. It is too big for local storage.";
        updateCacheInfo();
      }
    } catch (e) {
      if (e.name === "AbortError" && ctrl.userCancelled) panel.cancelled();
      else if (e.name === "AbortError") panel.fail("There was no response after two minutes. Send the request again. If this continues, contact SFG20 support.");
      else panel.fail("The request failed. The cause can be a network error or a blocked request.");
    } finally {
      clearTimeout(timer); send.disabled = viewCacheBtn.disabled = false; cancel.disabled = true; state.abort = null;
    }
  }
  function viewCache() {
    const url = buildUrl(ep, values);
    const hit = cacheGet(cfg.id, url);
    if (!hit) { msg.className = "msg bad"; msg.textContent = "There is no cached copy for this request."; updateCacheInfo(); return; }
    let parsed; try { parsed = JSON.parse(hit.text); } catch (e) { /* not JSON */ }
    msg.className = "msg"; msg.textContent = "";
    panel.done({ status: hit.status, statusText: hit.statusText, text: hit.text, parsed, ms: 0 }, url, { cachedAt: hit.savedAt });
  }
  send.addEventListener("click", () => run());
  viewCacheBtn.addEventListener("click", viewCache);
  clearCacheBtn.addEventListener("click", () => { cacheDelete(cfg.id, buildUrl(ep, values)); updateCacheInfo(); msg.className = "msg"; msg.textContent = "Cached copy cleared."; });
  cacheChk.addEventListener("change", () => { cacheOptSet(ep.id, cacheChk.checked); updateCacheInfo(); });
  cancel.addEventListener("click", () => { if (state.abort) { state.abort.userCancelled = true; state.abort.abort(); } });
  refreshPreview();
  return [headingBlock(ep), auth, reqAcc, ...docAccordions(ep), curlAcc];
}

function refreshChrome() {
  const sel = document.getElementById("cfgSelect");
  const a = active();
  sel.replaceChildren(...configs().map(c => { const o = h("option", { value: c.id, text: c.name }); if (a && c.id === a.id) o.selected = true; return o; }));
  document.getElementById("cfgGroup").style.display = configs().length ? "" : "none";
  const badge = document.getElementById("envBadge");
  badge.textContent = a ? ENVS[a.env].label : "";
  badge.className = "pill" + (a && a.env === "live" ? " bad" : "");
  document.getElementById("rootUrl").textContent = a ? rootOf(a) : "";
  document.getElementById("liveBar").classList.toggle("show", !!(a && a.env === "live"));
  renderTokenPill();
}

function setActive(id) {
  if (!findConfig(id) || id === state.store.activeId) return;
  state.store.activeId = id; state.last = {};
  saveStore(); refreshChrome();
}

function render() {
  const { id, arg } = parseHash();
  const app = document.getElementById("app");
  const colReq = document.getElementById("colReq");
  const colRes = document.getElementById("colRes");
  if (state.abort) { state.abort.userCancelled = true; state.abort.abort(); }

  // No configuration yet: only the setup wizard is available.
  const setup = id === "setup" || !configs().length;
  app.classList.toggle("setup", !configs().length);
  if (setup) {
    app.classList.add("single");
    colReq.replaceChildren(pageWizard(id === "setup" ? arg : ""));
    colRes.replaceChildren();
    document.title = "Setup - SFG20 API Explorer";
    markCurrent(); return;
  }
  const view = VIEWS.find(v => v.id === id) || VIEWS[0];
  if (view.page) {
    app.classList.add("single");
    const builders = { start: pageStart, configs: pageConfigs, cache: pageCache, swagger: pageSwagger, domain: pageDomain, lookups: pageLookups, glossary: pageGlossary, trouble: pageTrouble };
    colReq.replaceChildren(builders[view.id]());
    colRes.replaceChildren();
  } else {
    app.classList.remove("single");
    const panel = buildResponseColumn(view.id);
    colRes.replaceChildren(panel.node);
    colReq.replaceChildren(...(view.id === "token" ? viewToken(panel) : viewEndpoint(view.ep, panel)));
    panel.restore(state.last[view.id]);
  }
  colReq.scrollTop = 0;
  document.title = view.title + " - SFG20 API Explorer";
  markCurrent();
  document.getElementById("side").classList.remove("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded", "false");
}

function applyTheme(t) {
  document.documentElement.setAttribute("data-theme", t);
  const b = document.getElementById("themeBtn");
  b.textContent = t === "dark" ? "Light mode" : "Dark mode";
  b.setAttribute("aria-pressed", String(t === "dark"));
}

document.getElementById("cfgSelect").addEventListener("change", e => { setActive(e.target.value); render(); });
document.getElementById("themeBtn").addEventListener("click", () => {
  const next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  applyTheme(next); safeStore(localStorage, "set", "sfg20.theme", next);
});
document.getElementById("menuBtn").addEventListener("click", () => {
  const s = document.getElementById("side"); const open = s.classList.toggle("open");
  document.getElementById("menuBtn").setAttribute("aria-expanded", String(open));
});
document.getElementById("navFilter").addEventListener("input", e => renderNav(e.target.value));
window.addEventListener("hashchange", render);

state.store = loadStore();
applyTheme(safeStore(localStorage, "get", "sfg20.theme") === "dark" ? "dark" : "light");
renderNav("");
refreshChrome();
if (!configs().length && !location.hash) location.hash = "#setup";
render();
</script>
</body>
</html>
